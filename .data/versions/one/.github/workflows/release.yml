name: Release

on:
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: CompeyDev/setup-rokit@v0.2.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # The release gate is the merge gate. Nothing ships that would not merge.
      - run: lune run scripts/run.luau verify
      - run: lune run scripts/run.luau check
      - run: lune run scripts/run.luau bench

      # wally.toml is the one home of the version.
      - id: version
        run: echo "value=$(grep -m1 '^version' wally.toml | sed -E 's/.*"(.*)".*/\1/')" >> "$GITHUB_OUTPUT"

      - run: lune run scripts/run.luau build

      # The model a person downloads. Publishing to the registries happens from a machine
      # somebody is signed in on, with wally publish and npm publish at the repository root.
      - uses: softprops/action-gh-release@v3.0.0
        with:
          tag_name: v${{ steps.version.outputs.value }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: Cut against ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          files: build/Lync.rbxm

name: Publish (wally)

on:
  workflow_call:

permissions:
  contents: read

jobs:
  wally:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Only rokit.toml is read here, but setup-rokit reads it from the tree.
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: CompeyDev/setup-rokit@v0.2.1

      # The release built and verified these bytes. Building again here would
      # publish something nothing checked.
      - uses: actions/download-artifact@v8.0.1
        with:
          name: dist
          path: dist

      # Publishing from inside dist keeps wally's contents filter off the
      # repository .gitignore, which it reads relative to the working directory.
      - run: wally publish --token "$WALLY_TOKEN"
        working-directory: dist
        env:
          WALLY_TOKEN: ${{ secrets.WALLY_AUTH_TOKEN }}

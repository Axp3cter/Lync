[package]
name = "axp3cter/lync"
version = "3.1.1"
description = "Typed buffer networking for Roblox: packets, queries, and replicated sets."
authors = ["Axp3cter"]
license = "MIT"
homepage = "https://github.com/Axp3cter/Lync"
repository = "https://github.com/Axp3cter/Lync.git"
realm = "shared"
registry = "https://github.com/UpliftGames/wally-index"
# A consumer takes `src` through `default.project.json` and nothing else. The rest is what builds
# and checks the library rather than what runs it, and a registry holds a two megabyte ceiling.
exclude = [
    "index.d.ts",
    "package.json",
    "bench.project.json",
    "sourcemap.json",
    "package-lock.json",
    "test.project.json",
    "tsconfig.json",
    "rokit.toml",
    "stylua.toml",
    "test",
    "typedefs",
    "scripts",
    "bench",
    "fixtures",
    "node_modules",
    "build",
    "dist",
    ".github",
    ".vscode",
]
